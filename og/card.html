<!doctype html><html lang="ko"><head><meta charset="utf-8">
<!-- 링크 미리보기 카드(1200×630). scripts/og-image.mjs가 ELEV_SRC를 실제 입면 렌더로 바꿔 dist/og-image.png로 찍습니다. -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#f5f3ee;color:#242622;font-family:'Noto Sans KR',sans-serif;display:flex;overflow:hidden}
.pic{width:540px;height:630px;position:relative;overflow:hidden;border-right:1px solid rgba(36,38,34,.12)}
.pic img{position:absolute;left:50%;top:-40px;width:600px;translate:-50% 0}
.pic .tag{position:absolute;left:22px;bottom:20px;font:500 12px 'JetBrains Mono',monospace;letter-spacing:.12em;color:#b45309;background:rgba(245,243,238,.9);padding:6px 10px;border:1px solid rgba(36,38,34,.12)}
.txt{flex:1;padding:58px 60px 48px 56px;display:flex;flex-direction:column}
.k{font:500 15px 'JetBrains Mono','Noto Sans KR',monospace;letter-spacing:.18em;color:#b45309}
.brand{font:700 30px 'Noto Sans KR',sans-serif;letter-spacing:.14em;margin-top:20px}
h1{font:500 76px/.98 'Cormorant Garamond',Georgia,serif;letter-spacing:-.02em;margin-top:30px}
h1 em{font-style:italic;color:#424a3b;padding-left:.5em}
p{font:400 21px/1.6 'Noto Sans KR',sans-serif;color:rgba(36,38,34,.82);margin-top:26px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.chips span{font:500 14px 'Noto Sans KR',sans-serif;border:1px solid rgba(36,38,34,.22);padding:6px 11px;border-radius:999px}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid rgba(36,38,34,.14);padding-top:16px}
.foot b{font:500 14px 'JetBrains Mono',monospace;letter-spacing:.04em}
.foot i{font:500 11px 'Noto Sans KR',sans-serif;letter-spacing:.2em;color:#6b7280;font-style:normal;display:block;text-align:right}
.foot strong{font:500 22px 'Cormorant Garamond',Georgia,serif;letter-spacing:.06em}
</style></head><body>
<div class="pic"><img src="ELEV_SRC" alt=""><span class="tag">ELV A-201 · 1:200 · 2° TELE</span></div>
<div class="txt">
  <div class="k">PROCESS STUDY · 도면에서 준공까지</div>
  <div class="brand">FORMEQUA</div>
  <h1>From drawing<br><em>to site.</em></h1>
  <p>입면도 한 장이 3D가 되고, 법규·주차·공정·자금을 거쳐<br>실내까지 걸어 들어가는 스크롤 연구.</p>
  <div class="chips"><span>건폐율·용적률</span><span>법정 주차</span><span>공정·PF</span><span>평면·실내 투어</span></div>
  <div class="foot"><b>formequa-process-study.web.app</b><div><i>POWERED BY</i><strong>WAN2 ↗</strong></div></div>
</div>
</body></html>
