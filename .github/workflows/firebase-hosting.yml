# GitHub → Firebase Hosting 자동 배포
# main에 push: 테스트 → 빌드 → https://formequa-process-study.web.app (live)
# Pull request: 같은 검사 후 7일짜리 미리보기 채널 주소를 PR 댓글로 남김
# 필요한 저장소 Secret: FIREBASE_SERVICE_ACCOUNT_FORMEQUA_PROCESS_STUDY (서비스 계정 JSON 전체)
name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: firebase-hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build

      - name: Link preview image (og-image.png)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          npm i --no-save --ignore-scripts playwright-core@1.55.0
          OG_CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$OG_CHROME" ]; then npx playwright-core install chromium; fi
          echo "Chrome: ${OG_CHROME:-playwright chromium}"
          OG_CHROME="$OG_CHROME" node scripts/og-image.mjs || echo "::warning::og-image.png was not generated"
          ls -la dist/og-image.png || true

      - name: Preview channel (pull request)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FORMEQUA_PROCESS_STUDY }}
          projectId: formequa-process-study
          target: study
          expires: 7d

      - name: Live (main)
        if: github.event_name != 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FORMEQUA_PROCESS_STUDY }}
          projectId: formequa-process-study
          target: study
          channelId: live
